[project]
name = "production-ai-knowledge-engine"
version = "0.1.0"
description = "A production-oriented knowledge engine for measurable, grounded LLM systems."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.116,<1.0",
    "numpy>=2.0,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "qdrant-client>=1.15,<2.0",
    "rank-bm25>=0.2.2,<1.0",
    "sentence-transformers>=5.1,<6.0",
    "torch>=2.7,<3.0",
    "transformers>=4.55,<6.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "ipykernel>=6.30,<8.0",
    "ipywidgets>=8.1,<9.0",
    "mypy>=1.17,<2.0",
    "nbclient>=0.10,<1.0",
    "pytest>=8.4,<9.0",
    "ruff>=0.12,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "scripts"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend", "tests"]
